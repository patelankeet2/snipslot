name: CI

# Every push to main and every pull request is linted, type checked, tested and built.
# Render only deploys a commit once this workflow has passed.
on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # the in-memory MongoDB used by the tests downloads a mongod binary; keep it between runs
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - run: npm run build

  client:
    name: Client (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Type check and production build
        run: npm run build
        env:
          # public value, needed at build time for the Google sign in button
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
